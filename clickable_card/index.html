
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: transparent;
        }

        #cards {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 12px;
        }

        .form-card {
            width: 100%;
            height: 250px;
            box-sizing: border-box;
            border: 1px solid #dadce0;
            border-radius: 8px;
            background: #fff;
            color: #202124;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            text-align: left;
            padding: 0;
            transition: border-color 0.15s, box-shadow 0.15s;
        }

        .form-card:hover,
        .form-card:focus-visible {
            border-color: #673ab7;
            box-shadow: 0 1px 3px rgba(60, 64, 67, 0.2);
            outline: none;
        }

        .form-preview {
            height: 120px;
            flex-shrink: 0;
            border-bottom: 1px solid #dadce0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .form-preview-icon {
            width: 58px;
            height: 72px;
            border: 2px solid #673ab7;
            border-radius: 3px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 8px;
            padding: 10px;
            box-sizing: border-box;
        }

        .form-preview-icon span {
            height: 3px;
            border-radius: 2px;
            background: #673ab7;
        }

        .form-details {
            padding: 18px 12px 12px;
            display: flex;
            flex-direction: column;
            gap: 7px;
            flex: 1;
            min-height: 0;
            overflow: hidden;
        }

        .form-name {
            font-size: 14px;
            font-weight: 500;
            line-height: 1.4;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .form-meta {
            font-size: 12px;
            color: #5f6368;
        }

        @media (max-width: 700px) {
            #cards {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 420px) {
            #cards {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div id="cards"></div>

    <script>
        const cardsContainer = document.getElementById("cards");

        function sendMessage(type, extra = {}) {
            window.parent.postMessage({
                isStreamlitMessage: true,
                type,
                ...extra
            }, "*");
        }

        function renderCards(forms) {
            cardsContainer.replaceChildren();

            forms.forEach(form => {
                const card = document.createElement("button");
                card.className = "form-card";
                card.type = "button";

                const preview = document.createElement("div");
                preview.className = "form-preview";

                const icon = document.createElement("div");
                icon.className = "form-preview-icon";

                for (let i = 0; i < 3; i++) {
                    icon.appendChild(document.createElement("span"));
                }

                preview.appendChild(icon);

                const details = document.createElement("div");
                details.className = "form-details";

                const name = document.createElement("div");
                name.className = "form-name";
                name.textContent = form.name || "Untitled form";

                const meta = document.createElement("div");
                meta.className = "form-meta";
                meta.textContent = form.modified || "";

                details.append(name, meta);
                card.append(preview, details);

                card.addEventListener("click", () => {
                    sendMessage("streamlit:setComponentValue", {
                        value: form.id
                    });
                });

                cardsContainer.appendChild(card);
            });

            sendMessage("streamlit:setFrameHeight", {
                height: cardsContainer.scrollHeight + 4
            });
        }

        window.addEventListener("message", event => {
            if (
                event.data &&
                event.data.type === "streamlit:render"
            ) {
                renderCards(event.data.args.forms || []);
            }
        });

        sendMessage("streamlit:componentReady", {
            apiVersion: 1
        });
    </script>
</body>
</html>
